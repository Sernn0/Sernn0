<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이과두주 매니아 · 2月 일본 소도시 원정대</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#1b1f3b; --cream:#fff8ec; --paper:#fffdf7; --sub:#555b78; --mute:#8a8fa8;
  --red:#ff4d3d; --yellow:#ffd23f; --mint:#2ed3a5; --purple:#8b6cff; --pink:#ff6fb5; --orange:#ff9f1c; --sky:#3db5ff;
  --hard:5px 5px 0 var(--ink); --hard-s:3px 3px 0 var(--ink);
  --panelW:calc(33.333vw - 20px);
  --disp:"Black Han Sans","Pretendard",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:#5fb6f2;
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
#map{position:fixed;inset:0;width:100vw;height:100vh;cursor:grab;display:block;
  background:radial-gradient(1400px 1000px at 55% 45%,#8fd2ff 0%,#5fb6f2 55%,#3f97dc 100%)}
#map.drag{cursor:grabbing}
#map,#map *,#logo,#tools,#count,#toggles,#tip,#toast{-webkit-user-select:none;user-select:none}
body.dragging,body.dragging *{-webkit-user-select:none!important;user-select:none!important}
.ap{cursor:pointer;transition:opacity .25s}
.ap .sq{fill:var(--ink);stroke:#fff;stroke-width:2}
.ap .pl{font-size:13px;fill:#fff;pointer-events:none}
.ap text.an{opacity:0;transition:opacity .2s;font:400 12px var(--disp);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.ap:hover .apg{transform:scale(1.2)}
.ap .apg{transform-box:fill-box;transform-origin:50% 50%;transition:transform .15s}
.ap.on .sq{fill:var(--red)}
.ap.on text.an,.ap:hover text.an,.ap.lbl text.an{opacity:1}
#aplines line{stroke:var(--red);stroke-width:2.5;stroke-dasharray:6 5;stroke-linecap:round;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-11}}
.ap.on .apg{transform:scale(1.25)}
#land{filter:drop-shadow(5px 6px 0 rgba(27,31,59,.9))}
#land path{fill:var(--cream);stroke:var(--ink);stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#snow{position:fixed;inset:0;pointer-events:none;z-index:4}

/* pins */
.pin{cursor:pointer;transition:opacity .25s}
.pin .mk{transform-box:fill-box;transform-origin:50% 100%;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.pin:hover .mk{transform:scale(1.3)}
.pin .body{stroke:var(--ink);stroke-width:2}
.pin .eye{fill:#fff;stroke:var(--ink);stroke-width:1.5}
.pin .star{font:900 11px var(--disp);fill:var(--ink)}
.pin .ring{fill:none;stroke:var(--yellow);stroke-width:4;opacity:0}
.pin.match .ring{opacity:1}
.pin.sel .ring{opacity:1;stroke:#fff;animation:pulse 1.3s ease-out infinite}
.pin.sel .mk{animation:bounce .9s cubic-bezier(.3,1.6,.5,1) infinite alternate}
.pin text.lb{font:400 13px var(--disp);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none;opacity:0;transition:opacity .2s}
.pin.lbl text.lb,.pin.sel text.lb,.pin.match text.lb,.pin:hover text.lb{opacity:1}
.pin.sel text.lb{font-size:16px}
.pin.roll .mk{transform:scale(1.6)}
@keyframes pulse{0%{stroke-opacity:1;stroke-width:5}100%{stroke-opacity:0;stroke-width:1}}
@keyframes bounce{from{transform:translateY(0) scale(1.45)}to{transform:translateY(-7px) scale(1.45)}}

/* overlay UI */
.ui{position:fixed;z-index:10}
.card{background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;box-shadow:var(--hard)}
#logo{top:16px;left:18px;display:flex;align-items:center;gap:14px;user-select:none;pointer-events:none}
#logo .badge{width:62px;height:62px;border-radius:50%;background:var(--red);border:3px solid var(--ink);box-shadow:var(--hard-s);
  display:grid;place-items:center;transform:rotate(-10deg);position:relative}
#logo .badge svg{width:40px;height:40px}
#logo .badge:after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px dashed rgba(255,255,255,.7)}
#logo .tt{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
#logo b{font:400 32px/1 var(--disp);letter-spacing:-.5px;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
#logo small{font-size:12.5px;font-weight:800;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:3px 10px;transform:rotate(-2deg);box-shadow:2px 2px 0 var(--ink)}
#tools{top:98px;left:18px;display:flex;flex-direction:column;gap:8px}
.tbtn{width:42px;height:42px;border:2.5px solid var(--ink);background:#fff;border-radius:12px;font-size:18px;font-weight:900;color:var(--ink);cursor:pointer;box-shadow:var(--hard-s);transition:transform .1s,box-shadow .1s}
.tbtn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.tbtn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
#dice{width:auto;padding:0 14px;background:var(--yellow);font:400 16px var(--disp);display:flex;align-items:center;gap:6px;white-space:nowrap}
#dice:hover span{display:inline-block;animation:wig .4s}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-20deg)}75%{transform:rotate(20deg)}}
#count{position:fixed;left:18px;top:364px;z-index:10;font-size:12.5px;font-weight:800;line-height:1.5;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:7px 11px;box-shadow:var(--hard-s);pointer-events:none}
#count b{color:var(--red)}

#searchWrap{z-index:12;top:16px;right:16px;width:var(--panelW)}
#search{width:100%;height:52px;border-radius:16px;border:2.5px solid var(--ink);background:#fff;box-shadow:var(--hard);
  padding:0 46px;font:600 15.5px inherit;font-family:inherit;color:var(--ink);outline:none;transition:box-shadow .15s,transform .15s}
#search:focus{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink);border-color:var(--red)}
#search::placeholder{color:#9aa0b8;font-weight:500}
#searchWrap .ico{position:absolute;left:15px;top:15px;width:22px;height:22px;color:var(--ink)}
#clear{position:absolute;right:11px;top:11px;width:30px;height:30px;border:2px solid var(--ink);border-radius:9px;background:var(--yellow);color:var(--ink);cursor:pointer;display:none;font-weight:900}
#searchWrap.has #clear{display:block}
#sugg{margin-top:12px;max-height:50vh;overflow:auto;display:none;padding-bottom:6px}
#sugg.show{display:block}
#sugg .hd{padding:12px 16px 6px;font-size:12px;color:var(--sub);font-weight:800}
#sugg .it{padding:9px 16px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:14.5px;font-weight:700;align-items:center}
#sugg .it:hover,#sugg .it.on{background:#fff1c9}
#sugg .it span{color:var(--sub);font-size:12px;white-space:nowrap;font-weight:600}
#sugg .it i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);margin-right:8px}
#sugg .quick{padding:4px 14px 10px;display:flex;flex-wrap:wrap;gap:7px}

#panel{top:84px;right:16px;bottom:16px;width:var(--panelW);overflow:hidden;display:flex;flex-direction:column;
  transform:translateX(calc(100% + 40px)) rotate(3deg);transition:transform .45s cubic-bezier(.3,1.35,.5,1),opacity .2s}
#panel.open{transform:none}
#panel.faded{opacity:.15;pointer-events:none}
#pbody{overflow:auto;flex:1;scrollbar-width:thin}
#pclose{position:absolute;top:12px;right:12px;z-index:3;width:36px;height:36px;border-radius:11px;border:2.5px solid var(--ink);background:#fff;cursor:pointer;font-weight:900;font-size:15px;box-shadow:var(--hard-s)}
.gal{position:relative;aspect-ratio:16/10;background:var(--ink);overflow:hidden;border-bottom:2.5px solid var(--ink)}
.gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}
.gal img.on{opacity:1}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;cursor:pointer;font-weight:900;font-size:16px;box-shadow:var(--hard-s);z-index:2}
.gal .prev{left:10px}.gal .next{right:10px}
.gal .ctr{position:absolute;left:12px;top:12px;z-index:2;background:var(--ink);color:#fff;font-size:12px;font-weight:800;padding:4px 9px;border-radius:8px}
.gal .cr{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 12px 7px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal .cr a{color:#fff}
.gal .none{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:400 22px var(--disp);background:repeating-linear-gradient(45deg,#2a2f55 0 14px,#232847 14px 28px)}
.thumbs{display:flex;gap:7px;padding:10px 14px 0;overflow-x:auto;scrollbar-width:none}
.thumbs img{width:62px;height:44px;object-fit:cover;border-radius:8px;border:2.5px solid transparent;cursor:pointer;flex:none;opacity:.6;transition:opacity .15s}
.thumbs img.on{border-color:var(--ink);opacity:1;box-shadow:2px 2px 0 var(--ink)}
.pin-in{padding:16px 20px 26px;position:relative}
.stamp{position:absolute;right:16px;top:12px;width:76px;height:76px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);box-shadow:var(--hard-s);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(12deg);z-index:2}
.stamp b{font:400 30px/1 var(--disp)}
.stamp small{font-size:10px;font-weight:900;margin-top:2px}
.stamp.ex{background:#e6e3f5}
.stamp.ex b{font-size:16px}
.p-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;padding-right:80px}
.bdg{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:8px;border:2px solid var(--ink);background:#fff}
.bdg.reg{color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.25)}
.bdg.warn{background:#ffe08a}
.bdg.ex{background:#e6e3f5}
h1.p-ko{margin:2px 0 0;font:400 34px/1.1 var(--disp);letter-spacing:-.5px}
.p-jp{margin-top:6px;color:var(--sub);font-size:15px;font-weight:700}
.p-jp em{font-style:normal;color:var(--mute);font-weight:600;margin-left:6px;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 2px}
.tag{font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;border:2px solid var(--ink);cursor:pointer;background:#fff;transition:transform .1s}
.tag:hover{transform:translateY(-2px) rotate(-2deg)}
.tag.c0{background:#ffe1dd}.tag.c1{background:#dff2ff}.tag.c2{background:#ddf8ee}.tag.c3{background:#fff2c2}.tag.c4{background:#efe8ff}.tag.c5{background:#ffe3f1}
.tag.hit{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
section.p-sec{margin-top:22px}
section.p-sec h3{margin:0 0 10px;font:400 17px var(--disp);display:flex;align-items:center;gap:7px}
.feat{font-size:15.5px;line-height:1.6;font-weight:600}
.reason{margin-top:10px;font-size:13.5px;font-weight:700;background:#ffe9e6;border:2px dashed var(--red);border-radius:12px;padding:10px 12px;line-height:1.5}
.trans{font-size:14.5px;line-height:1.6;font-weight:600;background:#f3f8ff;border:2px solid var(--ink);border-radius:14px;padding:12px 14px}
.trans .meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.trans .meta span{font-size:12px;font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:3px 8px}
.infra{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inf{border:2px solid var(--ink);border-radius:14px;padding:10px 10px 9px;text-align:center;background:#fff;display:flex;flex-direction:column;gap:3px;align-items:center}
.inf .em{font-size:22px}
.inf .nm{font-weight:800;font-size:13px}
.inf .st{font-size:11.5px;font-weight:900;padding:2px 8px;border-radius:999px;border:1.5px solid var(--ink)}
.st.y{background:#c9f5df}.st.p{background:#ffe8a3}.st.n{background:#ffd0ca}.st.q{background:#eceef4}
.inf .nt{font-size:11px;color:var(--sub);line-height:1.35;font-weight:600}
.inf a{font-size:11.5px;font-weight:900;color:var(--ink);margin-top:2px}
.fine{margin-top:12px;font-size:11.5px;color:var(--mute);line-height:1.6;font-weight:500}
.scores{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:13px;font-weight:700}
.bar{height:12px;border-radius:9px;background:#eef0f6;overflow:hidden;border:2px solid var(--ink)}.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--red) 0 6px,#ff7a5c 6px 12px)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:flex;align-items:center;gap:8px;padding:11px 12px;border:2px solid var(--ink);border-radius:12px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:800;background:#fff;box-shadow:2px 2px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.links a:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:#fff8de}

#toggles{left:16px;bottom:16px;max-width:calc(66.666vw - 40px);padding:9px 12px;display:flex;flex-wrap:wrap;gap:7px 12px;align-items:center}
.tg-grp{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tg-grp>em{font-style:normal;font:400 13px var(--disp);margin-right:2px;color:var(--sub)}
.chip{border:2px solid var(--ink);background:var(--c);border-radius:999px;padding:4px 10px 4px 8px;font:800 12.5px inherit;font-family:inherit;cursor:pointer;color:var(--ink);display:flex;gap:5px;align-items:center;box-shadow:2px 2px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .15s}
.chip:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.chip small{font-weight:700;opacity:.65}
.chip.off{background:#fff;border-style:dashed;border-color:#9aa0b8;color:#9aa0b8;box-shadow:none}
.chip.off .e{filter:grayscale(1);opacity:.5}
#tgReset{border:0;background:none;color:var(--red);font:400 14px var(--disp);cursor:pointer}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:#fff;padding:8px 11px;border-radius:10px;font-size:13px;font-weight:800;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:3px 3px 0 rgba(0,0,0,.25)}
#tip span{color:var(--yellow);margin-left:6px}
#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-120px);z-index:30;background:var(--yellow);border:2.5px solid var(--ink);box-shadow:var(--hard);border-radius:14px;padding:10px 16px;font:400 18px var(--disp);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<svg id="map" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="waves" width="46" height="24" patternUnits="userSpaceOnUse">
      <path d="M2 14 q5 -6 10 0 t10 0" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#waves)" id="wavebg"/>
  <g id="world"><g id="land"></g></g>
  <g id="aplines"></g>
  <g id="aps"></g>
  <g id="pins"></g>
</svg>
<canvas id="snow"></canvas>

<div id="logo" class="ui">
  <div class="badge"><svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 9h18l-3 24H14z" fill="rgba(255,255,255,.18)"/><path d="M12.5 17h15"/><path d="M17 23v5"/><circle cx="31" cy="8" r="2" fill="#fff" stroke="none"/><circle cx="34.5" cy="13" r="1.3" fill="#fff" stroke="none"/></svg></div>
  <div class="tt"><b>이과두주 매니아</b><small>✈️ 2027 · 2月 일본 소도시 원정대</small></div>
</div>
<div id="tools" class="ui">
  <button class="tbtn" id="dice" title="표시 중인 후보 중 하나를 랜덤으로 뽑아요"><span>🎲</span>랜덤 뽑기</button>
  <button class="tbtn" id="zin" title="확대">＋</button>
  <button class="tbtn" id="zout" title="축소">－</button>
  <button class="tbtn" id="zfit" title="전체 보기">⤢</button>
  <button class="tbtn" id="snowBtn" title="눈 효과 켜기/끄기">❄️</button>
</div>
<div id="count"></div>

<div id="searchWrap" class="ui">
  <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="search" type="text" autocomplete="off" placeholder="어디로 갈까? 온천, 게, 눈, 호수, 高山…">
  <button id="clear" title="지우기">✕</button>
  <div id="sugg" class="card"></div>
</div>

<aside id="panel" class="ui card" aria-live="polite">
  <button id="pclose" title="닫기">✕</button>
  <div id="pbody"></div>
</aside>

<div id="toggles" class="ui card"></div>
<div id="tip"></div>

let animId=null;
function go(t,anim){
  cancelAnimationFrame(animId);

  const s={...T},t0=performance.now(),D=520;
  const step=n=>{const u=Math.min(1,(n-t0)/D),e=1-Math.pow(1-u,3);
    T.k=s.k+(t.k-s.k)*e;T.x=s.x+(t.x-s.x)*e;T.y=s.y+(t.y-s.y)*e;render(); if(u<1)animId=requestAnimationFrame(step)};
  animId=requestAnimationFrame(step);
}
const baseK=()=>Math.min((innerWidth-80)/BOX.w,(innerHeight-250)/BOX.h);
function zoomAt(f,cx,cy,anim){
  const bk=baseK(); const k=Math.max(bk*0.6,Math.min(bk*14,T.k*f)); const r=k/T.k;

}

const cv=document.getElementById('snow'), cx=cv.getContext('2d'); let flakes=[], snowOn=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeSnow(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
function mkFlake(y){return {x:Math.random()*innerWidth,y:y??-10,r:1+Math.random()*2.6,s:.35+Math.random()*.9,w:Math.random()*6.28,a:.5+Math.random()*.45}}
for(let i=0;i<90;i++) flakes.push(mkFlake(Math.random()*innerHeight));
function snowLoop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  if(snowOn){ for(const f of flakes){ f.y+=f.s; f.w+=.012; f.x+=Math.sin(f.w)*.45; if(f.y>innerHeight+8) Object.assign(f,mkFlake());
    cx.beginPath(); cx.arc(f.x,f.y,f.r,0,6.283); cx.fillStyle=`rgba(255,255,255,${f.a})`; cx.fill(); } }
  requestAnimationFrame(snowLoop);
}
document.getElementById('snowBtn').onclick=()=>{snowOn=!snowOn;toast(snowOn?'❄️ 눈 내리는 중':'☀️ 눈 그쳤어요')};
sizeSnow(); snowLoop();

drawToggles(); fit(false); applyState();
</script>
</body>
</html>
